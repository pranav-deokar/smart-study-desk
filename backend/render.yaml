services:
  - type: web
    name: smart-study-desk-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DISTANCE_THRESHOLD_CM
        value: "55"
      - key: BAD_POSTURE_ANGLE_THRESHOLD
        value: "160"
